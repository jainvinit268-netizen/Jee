name: Build and Release EDUNITI Native Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Prepare offline question bank and images
        working-directory: android
        run: bash scripts/prepare-assets.sh
      - name: Build native debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDUNITI-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: EDUNITI Android App v1.0.0
          body: |
            First public release of the EDUNITI native Android app.
            Built from commit ${{ github.sha }}.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
